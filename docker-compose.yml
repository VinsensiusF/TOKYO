services:
  ollama:
    image: ollama/ollama
    volumes: [ollama:/root/.ollama]
    environment:
      - OLLAMA_KEEP_ALIVE=24h        # model stays in RAM
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1        # one user: don't reserve RAM for parallel slots
    restart: unless-stopped

  web:
    build: .
    image: tokyo:latest
    command: streamlit run main.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    env_file: .env
    environment: &env
      - OLLAMA_URL=http://ollama:11434
      - GOOGLE_TOKEN=/secrets/token.json
      - GOOGLE_CREDENTIALS=/secrets/credentials.json
    volumes: &vols
      - ./secrets:/secrets
      - hf:/root/.cache/huggingface   # whisper model downloads once
    ports: ["127.0.0.1:8501:8501"]   # localhost only; public traffic goes via Caddy
    depends_on: [ollama]
    restart: unless-stopped

  bot:
    image: tokyo:latest              # same image, different entrypoint
    command: python bot.py
    env_file: .env
    environment: *env
    volumes: *vols
    depends_on: [ollama, web]
    restart: unless-stopped

  caddy:
    image: caddy:2
    profiles: [prod]                  # skipped on your laptop; VPS: --profile prod
    ports: ["80:80", "443:443"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile, caddy:/data]
    depends_on: [web]
    restart: unless-stopped

volumes: { ollama: {}, hf: {}, caddy: {} }
